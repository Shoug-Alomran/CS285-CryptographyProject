site_name: Discrete Mathematics for Computing
site_description: CS285 secure key exchange project. Diffie–Hellman key exchange in Java, from modular arithmetic and primitive roots to a working encrypted message, with implementation notes, source code and test results.
site_author: Shoug Fawaz Alomran
site_url: https://secure-key-exchange.shoug-tech.com/
repo_url: https://github.com/Shoug-Alomran/CS285-CryptographyProject
use_directory_urls: true
exclude_docs: |
  .DS_Store
copyright: © 2026 Shoug Fawaz Alomran · All rights reserved

theme:
  # Fully custom theme (no Material), shared with the other shoug-tech course
  # sites. Templates live in theme/, styles and scripts in docs/assets/.
  name: null
  custom_dir: theme
  locale: en
  static_templates:
    - 404.html
  # Only build search/search_index.json; the ⌘K palette in site.js reads it.
  search_index_only: true

nav:
  - Home: index.md
  - Project:
      - About: about.md
      - Introduction: introduction.md
      - Team: team.md
      - References: references.md
  - Code:
      - Architecture: implementation.md
      - Main: code/main.md
      - Key Exchange: code/keyexchange.md
      - Encryptor: code/encryptor.md
      - Parameters: code/parameters.md
      - Helpers: code/helpers.md
      - Validator: code/validator.md
      - Utils: code/utils.md
  - Evaluation:
      - Results: results.md
      - Advantages & Limitations: advantages-limitations.md
      - Conclusion: conclusion.md
      - Report: report/report.md

plugins:
  - search

hooks:
  - hooks/icons.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "#"

validation:
  nav:
    # copyright.md is intentionally footer-only (see theme/main.html).
    omitted_files: ignore
    not_found: warn
    absolute_links: ignore
  links:
    not_found: warn
    unrecognized_links: warn
